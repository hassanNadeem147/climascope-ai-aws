version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Checking Python version..."
      - python --version
      - aws --version

  pre_build:
    commands:
      - echo "Validating project files..."
      - test -f app/main.py
      - test -f requirements.txt
      - test -f .env.example

  build:
    commands:
      - echo "Project validation successful."

artifacts:
  files:
    - '**/*'
  discard-paths: no