
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12

  build:
    commands:
      - echo "Validating dependencies and Python syntax"
      - python -m pip install -r requirements.txt
      - python -m compileall -q app

  post_build:
    commands:
      - echo "Deployment steps will be enabled after EC2 setup"
