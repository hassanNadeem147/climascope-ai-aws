name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climascope-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q app run.py

      - name: Check deployment script syntax
        run: |
          bash -n .github/scripts/deploy-ec2.sh
          bash -n .github/scripts/setup-ec2-service.sh

  deploy:
    name: Deploy to AWS EC2
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is required." >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is required." >&2; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is required." >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is required." >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is required." >&2; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST must be an IP address or hostname." >&2; exit 1; }
          [[ "$DEPLOY_USER" == "clima-deploy" ]] || { echo "DEPLOY_USER must be clima-deploy, not an administrative account." >&2; exit 1; }
          [[ "$DEPLOY_PATH" == "/home/clima-deploy/apps/clima" ]] || { echo "DEPLOY_PATH must be /home/clima-deploy/apps/clima." >&2; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy application and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release_name="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh "${ssh_options[@]}" "$target" \
            "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env' && test -r '$DEPLOY_PATH/.env'"

          ssh "${ssh_options[@]}" "$target" \
            "mkdir -p '$DEPLOY_PATH/releases/$release_name'"

          tar -czf - -- app frontend run.py requirements.txt \
            | ssh "${ssh_options[@]}" "$target" \
              "tar -xzf - -C '$DEPLOY_PATH/releases/$release_name'"
          ssh "${ssh_options[@]}" "$target" \
            "bash -s -- '$DEPLOY_USER' '$DEPLOY_PATH' '$release_name'" \
            < .github/scripts/deploy-ec2.sh